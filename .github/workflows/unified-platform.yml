name: Unified Platform Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/unified-platform]

jobs:
  backend:
    name: FastAPI and companion regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run tests without external API or AI keys
        working-directory: backend
        env:
          LLM_PROVIDER: template
          COMPANION_ENABLE_LLM: "false"
        run: python -m pytest -q

  frontend:
    name: Next.js TypeScript, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build Next.js website
        working-directory: frontend
        run: npm run build
